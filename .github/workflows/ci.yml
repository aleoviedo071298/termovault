name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-docs:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validar enlaces internos en .md
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: '.github/markdown-link-check-config.json'
        continue-on-error: true

  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validar sintaxis YAML
        run: |
          pip install yamllint
          yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable, truthy: {check-keys: false}}}' .github/

  test-backend:
    name: Test Backend (Laravel)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: termovault_test
          POSTGRES_PASSWORD: password
          POSTGRES_DB: termovault_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, json, bcmath
          coverage: xdebug

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: cd backend && composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Laravel environment
        run: |
          cd backend
          cp .env.example .env
          # Configure for testing
          sed -i 's/APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=localhost/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=termovault_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=termovault_test/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=password/' .env
          sed -i 's/CACHE_STORE=.*/CACHE_STORE=array/' .env
          sed -i 's/COGNITO_AUTH_REQUIRED=.*/COGNITO_AUTH_REQUIRED=false/' .env
          # Cognito test config (no real AWS needed; HTTP calls are faked in tests).
          # Region + client_id deben estar presentes para no cortar en 500 antes del flujo.
          sed -i 's/COGNITO_REGION=.*/COGNITO_REGION=us-east-1/' .env
          sed -i 's/COGNITO_USER_POOL_ID=.*/COGNITO_USER_POOL_ID=us-east-1_test/' .env
          sed -i 's/COGNITO_APP_CLIENT_ID=.*/COGNITO_APP_CLIENT_ID=test_client_id/' .env
          sed -i 's/COGNITO_APP_CLIENT_SECRET=.*/COGNITO_APP_CLIENT_SECRET=test_client_secret/' .env
          # S3/MinIO: el almacenamiento se fakea en tests (Storage::fake); el bucket
          # debe coincidir con el esperado en las aserciones de los tests.
          sed -i 's/AWS_ACCESS_KEY_ID=.*/AWS_ACCESS_KEY_ID=testing/' .env
          sed -i 's/AWS_SECRET_ACCESS_KEY=.*/AWS_SECRET_ACCESS_KEY=testing/' .env
          sed -i 's/AWS_BUCKET=.*/AWS_BUCKET=termovault-dev/' .env
          # Generate APP_KEY
          php artisan key:generate

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U termovault_test; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done

      - name: Run migrations
        run: cd backend && php artisan migrate --env=testing
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: termovault_test
          DB_USERNAME: termovault_test
          DB_PASSWORD: password

      - name: Run tests
        run: cd backend && php artisan test --no-coverage
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: termovault_test
          DB_USERNAME: termovault_test
          DB_PASSWORD: password

      - name: Run tests with coverage
        run: cd backend && php artisan test --coverage --min=70 || true
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: termovault_test
          DB_USERNAME: termovault_test
          DB_PASSWORD: password

  # Cuando exista código real, agregar acá:
  # - test-web (TypeScript/React)
  # - test-mobile (Flutter)
