# ============================================================
# TermoVault — entorno local de desarrollo
# ============================================================
# Levanta Postgres + MinIO (S3 local) + Adminer (UI DB)
# en un solo comando: docker compose up -d
#
# Postgres queda con el schema + 65 elementos seedados automáticamente
# en el primer arranque. Después podés conectarte por:
#   - psql -h localhost -p 5432 -U termovault -d termovault
#   - Adminer:    http://localhost:8080
#   - MinIO UI:   http://localhost:9001
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: termovault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-termovault}
      POSTGRES_USER: ${POSTGRES_USER:-termovault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devsecret_cambiar_en_prod}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database:/sql:ro
      - ./infra/docker/postgres-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-termovault} -d ${POSTGRES_DB:-termovault}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - termovault

  adminer:
    image: adminer:4
    container_name: termovault-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - termovault

  minio:
    image: minio/minio:latest
    container_name: termovault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_cambiar}
      MINIO_REGION_NAME: ${MINIO_REGION:-us-east-1}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - termovault

  # Sidecar que crea el bucket inicial y se apaga
  minio-init:
    image: minio/mc:latest
    container_name: termovault-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_cambiar}
      MINIO_BUCKET: ${MINIO_BUCKET:-termovault-dev}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set download local/$$MINIO_BUCKET/public 2>/dev/null || true;
      echo '✓ Bucket' $$MINIO_BUCKET 'listo';
      "
    networks:
      - termovault

volumes:
  postgres-data:
    name: termovault-postgres-data
  minio-data:
    name: termovault-minio-data

networks:
  termovault:
    name: termovault-net
    driver: bridge
