# ─────────────────────────────────────────────────────────────────────────────
# TermoVault — Cabeceras de seguridad para el documento HTML (SPA) en producción
#
# Esta es la FUENTE CANÓNICA de la CSP del frontend. Debe mantenerse alineada con
# backend/app/Http/Middleware/SecurityHeaders.php (CSP de la API).
#
# Uso (en el server/location que sirve el index.html del build de Vite):
#     include /etc/nginx/snippets/termovault-security-headers.conf;
#
# FIX [006]: script-src se limita a 'self'. NO se permite ningún CDN externo
# (p. ej. cdn.jsdelivr.net): si el CDN se viera comprometido, habilitaría XSS
# masivo sobre toda la aplicación. El build de Vite usa módulos servidos desde
# el propio origen, por lo que no se requiere ningún host externo de scripts.
# ─────────────────────────────────────────────────────────────────────────────

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://cognito-idp.us-east-2.amazonaws.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# HSTS — fuerza HTTPS durante 1 año (el sitio se sirve solo por HTTPS; HTTP→HTTPS
# 301 en el edge). Cubre la primera carga del documento HTML estático.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
